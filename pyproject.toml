[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chironjp"
version = "0.1.0"
description = "Sanitized public preview of Chiron's review-first job preparation core"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
chironctl = "chironjp.cli:main"
chironjp-resume = "chironjp.resume:main"

[project.optional-dependencies]
browser = [
  "browser-harness==0.1.9",
  "browser-use==0.13.8",
  "websockets==15.0.1",
]
review = [
  "bcrypt>=4,<6",
  "websockify==0.13.0",
  "websockets==15.0.1",
]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["chironjp"]

[tool.setuptools.package-data]
chironjp = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
